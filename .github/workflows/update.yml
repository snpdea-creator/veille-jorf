name: Mise à jour quotidienne de la veille JORF

on:
  schedule:
    # Heures en UTC. En heure d'hiver (UTC+1) : 07:30 UTC = 8h30 et 12:00 UTC = 13h00 à Paris.
    # En heure d'été (UTC+2, fin mars à fin octobre), remplacer par '30 6' et '0 11'.
    - cron: '30 7 * * 1-5'
    - cron: '0 12 * * 1-5'
  workflow_dispatch: {}   # permet de lancer manuellement depuis l'onglet Actions

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Récupérer les nouveaux textes (DILA + Conseil des ministres)
        run: |
          python fetch_cdm.py
          python weekly_update.py

      - name: Committer les données mises à jour
        run: |
          git config user.name "veille-jorf-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json data.js diff_report.json cdm.json
          git diff --cached --quiet || git commit -m "Mise à jour veille JORF $(date -u +%Y-%m-%d)"
          git push

      - name: Créer une alerte (issue + email) si nouveaux textes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF' > issue_body.md
          import json
          with open("diff_report.json", encoding="utf-8") as f:
              d = json.load(f)
          items = d.get("new_items", [])
          if items:
              print(f"**{len(items)} nouveau(x) texte(s)** détecté(s) le {d['run_at'][:10]} :\n")
              for it in items:
                  cats = ", ".join(it.get("categories", []))
                  print(f"- [{it['title']}]({it['url']}) — _{cats}_")
          PYEOF
          if [ -s issue_body.md ]; then
            COUNT=$(python3 -c "import json; print(json.load(open('diff_report.json'))['new_count'])")
            gh issue create \
              --title "Veille JORF — $COUNT nouveau(x) texte(s) ($(date -u +%Y-%m-%d))" \
              --body-file issue_body.md
          else
            echo "Aucun nouveau texte, pas d'alerte créée."
          fi

      - name: Préparer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publier sur GitHub Pages
        uses: actions/deploy-pages@v4
